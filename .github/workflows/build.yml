name: Build Tweak

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Build
        run: |
          export THEOS=$HOME/theos
          make package

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: AmongUsModMenu
          path: |
            .theos/obj/**/*.dylib
            packages/*.deb
